<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kayo Bitencourt — Front-end Developer &amp; UI/UX Designer</title>
  <desc id="desc">Banner com estética de terminal, fundo escuro e detalhes em azul do Arch Linux.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#102838"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#1793d1"/><stop offset="1" stop-color="#61dafb"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8ccce9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#background)" stroke="#303f4b"/>
  <rect x="2" y="2" width="1196" height="316" rx="19" fill="url(#grid)"/>
  <path d="M1 52H1199" stroke="#303f4b"/>
  <circle cx="29" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="51" cy="27" r="6" fill="#febc2e"/>
  <circle cx="73" cy="27" r="6" fill="#28c840"/>
  <text x="600" y="33" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b9cad">kayo@archlinux: ~/profile</text>
  <text x="50" y="101" font-family="monospace" font-size="17" fill="#61dafb">$ whoami</text>
  <text x="47" y="171" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#f0f6fc">Kayo Bitencourt</text>
  <text x="50" y="213" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#b5c5d4">Front-end Developer &amp; UI/UX Designer</text>
  <rect x="50" y="245" width="257" height="31" rx="7" fill="#1793d1" fill-opacity=".14" stroke="#1793d1" stroke-opacity=".5"/>
  <text x="67" y="266" font-family="monospace" font-size="13" fill="#70c8f2">ARCH LINUX / WEB DEVELOPMENT</text>
  <g transform="translate(985 112)" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-4 26L-32 54L-4 82M84 26L112 54L84 82M57 8L27 102"/>
  </g>
  <text x="955" y="264" font-family="monospace" font-size="14" fill="#61dafb">build. learn. repeat.</text>
  <rect x="336" y="250" width="9" height="21" rx="1" fill="#61dafb">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
